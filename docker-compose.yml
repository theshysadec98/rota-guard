name: rota-guard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rotaguard
      POSTGRES_USER: rotaguard
      POSTGRES_PASSWORD: rotaguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotaguard -d rotaguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
