name: rota-guard

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: rotaguard
      MYSQL_USER: rotaguard
      MYSQL_PASSWORD: rotaguard
      MYSQL_ROOT_PASSWORD: rotaguard_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -protaguard_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
