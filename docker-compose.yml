# docker compose up --build

name: rota-guard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rotaguard
      POSTGRES_USER: rotaguard
      POSTGRES_PASSWORD: rotaguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotaguard -d rotaguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  be:
    build:
      context: ./be
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rotaguard
      SPRING_DATASOURCE_USERNAME: rotaguard
      SPRING_DATASOURCE_PASSWORD: rotaguard
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  fe:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    depends_on:
      be:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
